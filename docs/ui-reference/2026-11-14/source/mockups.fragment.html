#wt-screens{color-scheme:dark}
#wt-screens [hidden]{display:none!important}
#wt-screens .ws-stage{display:flex;justify-content:center;align-items:flex-start;padding:24px 0 30px;min-height:1050px}
#wt-screens .ws-phone{
 --ws-bg:light-dark(#f6f7fa,#171b21);--ws-surface:light-dark(#fff,#242a33);--ws-ink:light-dark(#202b3a,#edf2fa);
 --ws-sub:light-dark(#636f7e,#adb9c9);--ws-line:light-dark(#e2e6ed,#3c4654);--ws-blue:light-dark(#2d6096,#aacdf5);
 --ws-tint:light-dark(#eaf1fa,#2b3b50);--ws-on:light-dark(#fff,#17283e);--ws-green:light-dark(#3c604c,#b9d8c3);--ws-sage:light-dark(#e8f0e9,#293e32);
 --ws-radius:18px;--ws-danger:light-dark(#9c3a38,#f2b0aa);
 width:min(406px,100%);min-width:0;min-height:880px;padding:max(24px,env(safe-area-inset-top)) 20px max(14px,env(safe-area-inset-bottom));
 border:1px solid var(--ws-line);border-radius:30px;background:var(--ws-bg);color:var(--ws-ink);font:400 14px/1.5 WSComic,system-ui,sans-serif;overflow-wrap:anywhere;
 display:flex;flex-direction:column;
}
#wt-screens .ws-phone *{box-sizing:border-box}
#wt-screens .ws-phone h2,#wt-screens .ws-phone h3,#wt-screens .ws-phone p{margin:0}
#wt-screens .ws-phone h2{font-size:27px;line-height:1.25;letter-spacing:-1.1px;font-weight:700}
#wt-screens .ws-phone h3{font-size:16px;line-height:1.4;font-weight:700}
#wt-screens .ws-phone button,#wt-screens .ws-phone input,#wt-screens .ws-phone select,#wt-screens .ws-phone textarea{font-family:inherit}
#wt-screens .ws-phone button{min-width:44px;min-height:44px;padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:22px;background:none;color:var(--ws-blue);font-size:13px;touch-action:manipulation}
#wt-screens .ws-phone button:disabled{opacity:.45}
#wt-screens .ws-phone :focus-visible{outline:2px solid var(--ws-blue);outline-offset:3px}
#wt-screens .ws-phone svg{width:19px;height:19px;flex-shrink:0}
#wt-screens .ws-phone .ws-primary{background:var(--ws-blue);color:var(--ws-on);font-weight:700}
#wt-screens .ws-phone .ws-soft{background:var(--ws-tint);font-size:12px;font-weight:700}
#wt-screens .ws-phone .ws-full{display:flex;width:100%;min-height:48px}
#wt-screens .ws-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:22px}
#wt-screens .ws-subtitle{font-size:12px;color:var(--ws-sub);margin-top:8px!important}
#wt-screens .ws-header>div{min-width:0}
#wt-screens .ws-header>button{flex-shrink:0}
#wt-screens .ws-backbar{display:flex;align-items:center;justify-content:space-between;margin:-8px -8px 13px}
#wt-screens .ws-backbar button{font-size:12px}
#wt-screens .ws-search{display:flex;align-items:center;gap:8px;padding:0 13px;background:var(--ws-surface);border:1px solid var(--ws-line);border-radius:14px;margin-bottom:14px;color:var(--ws-sub)}
#wt-screens .ws-search input{border:0;background:none;color:var(--ws-ink);font-size:16px;min-width:0;width:100%;height:48px;padding:0;outline-offset:1px}
#wt-screens .ws-phone input::placeholder{color:var(--ws-sub);opacity:1}
#wt-screens .ws-segment{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px;background:var(--ws-line);border-radius:14px;margin-bottom:20px}
#wt-screens .ws-segment button{font-size:12px;color:var(--ws-sub);min-height:44px;border-radius:11px;padding:7px}
#wt-screens .ws-segment button[aria-pressed=true]{background:var(--ws-surface);color:var(--ws-ink);font-weight:700}
#wt-screens .ws-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#wt-screens .ws-phone .ws-recipe-tile{display:block;min-width:0;padding:0;overflow:hidden;border-radius:var(--ws-radius);background:var(--ws-surface);text-align:left;color:var(--ws-ink);width:100%}

 const recipes=[{"servings":2,"ingredients":[{"name":"Spaghetti","amount":180,"unit":"g"},{"name":"Rinderhackfleisch","amount":250,"unit":"g"},{"name":"Passierte Tomaten","amount":300,"unit":"g"},{"name":"Zwiebeln","amount":1,"unit":"Stück"},{"name":"Karotten","amount":1,"unit":"Stück"},{"name":"Tomatenmark","amount":1,"unit":"EL"},{"name":"Olivenöl","amount":1,"unit":"EL"},{"name":"Parmesan","amount":30,"unit":"g"}],"steps":["Zwiebel und Karotte fein würfeln. Spaghetti in reichlich Salzwasser nach Packungsangabe bissfest kochen.","Olivenöl in einem Topf erhitzen. Hackfleisch krümelig und vollständig braun braten. Gemüse und Tomatenmark zugeben und 4 Minuten anbraten.","Passierte Tomaten einrühren und die Sauce 15–20 Minuten sanft köcheln lassen. Abschmecken, mit Spaghetti anrichten und Parmesan darüberreiben."]},{"servings":2,"ingredients":[{"name":"Tofu","amount":250,"unit":"g","note":"fest"},{"name":"Reis","amount":150,"unit":"g"},{"name":"Kokosmilch","amount":400,"unit":"ml"},{"name":"Rote Currypaste","amount":1,"unit":"EL"},{"name":"Brokkoli","amount":150,"unit":"g"},{"name":"Paprika","amount":1,"unit":"Stück"},{"name":"Rapsöl","amount":1,"unit":"EL"},{"name":"Limette","amount":0.5,"unit":"Stück"}],"steps":["Reis nach Packungsangabe garen. Tofu trocken pressen und würfeln, Brokkoli in Röschen und Paprika in Streifen schneiden.","Öl in einem Topf erhitzen. Tofu rundum 5–6 Minuten goldbraun braten. Currypaste einrühren und 1 Minute anrösten.","Kokosmilch und Gemüse zugeben und 10–12 Minuten sanft köcheln, bis Brokkoli gar, aber noch bissfest ist. Mit Limettensaft abschmecken und mit Reis servieren."]},{"servings":2,"ingredients":[{"name":"Lachs","amount":300,"unit":"g","note":"zwei Filets, frisch oder vollständig aufgetaut"},{"name":"Kartoffeln","amount":500,"unit":"g"},{"name":"Blattspinat","amount":300,"unit":"g","note":"tiefgekühlt"},{"name":"Zwiebeln","amount":1,"unit":"Stück"},{"name":"Knoblauch","amount":1,"unit":"Zehen"},{"name":"Sahne","amount":50,"unit":"ml"},{"name":"Butter","amount":10,"unit":"g"},{"name":"Rapsöl","amount":1,"unit":"TL"},{"name":"Zitronen","amount":0.5,"unit":"Stück"},{"name":"Muskatnuss","amount":null,"unit":"","note":"eine Prise"},{"name":"Salz","amount":null,"unit":"","note":"nach Geschmack"},{"name":"Pfeffer","amount":null,"unit":"","note":"nach Geschmack"}],"steps":["Kartoffeln schälen, in gleich große Stücke schneiden und in Salzwasser 18–20 Minuten weich kochen. Zwiebel und Knoblauch fein würfeln.","Butter in einem Topf schmelzen, Zwiebel und Knoblauch 3 Minuten dünsten. Spinat mit einem kleinen Schuss Wasser zugeben und zugedeckt nach Packungsangabe erhitzen. Sahne einrühren, kurz köcheln lassen und mit Muskat, Salz und Pfeffer würzen.","Lachs trocken tupfen und würzen. Öl in einer Pfanne erhitzen, Filets je nach Dicke etwa 4–5 Minuten je Seite bei mittlerer Hitze braten, bis sie vollständig durchgegart sind. Mit Zitronensaft beträufeln und mit abgegossenen Kartoffeln und Spinat servieren."]},{"servings":2,"ingredients":[{"name":"Tortilla-Wraps","amount":4,"unit":"Stück"},{"name":"Hähnchenbrust","amount":250,"unit":"g"},{"name":"Salat","amount":4,"unit":"Blätter"},{"name":"Tomaten","amount":1,"unit":"Stück"},{"name":"Joghurt","amount":100,"unit":"g"},{"name":"Gurke","amount":0.5,"unit":"Stück"},{"name":"Paprikapulver","amount":1,"unit":"TL"},{"name":"Rapsöl","amount":1,"unit":"EL"}],"steps":["Hähnchen in Streifen schneiden und mit Paprikapulver würzen. Öl in einer Pfanne erhitzen und die Streifen 6–8 Minuten vollständig durchbraten.","Gurke raspeln und mit Joghurt verrühren, mit Salz und Pfeffer abschmecken. Salat waschen und Tomate würfeln.","Wraps nach Packungsangabe erwärmen. Mit Joghurtsauce, Salat, Tomate und Hähnchen belegen, Seiten einschlagen und eng aufrollen."]},{"servings":2,"ingredients":[{"name":"Kartoffeln","amount":600,"unit":"g"},{"name":"Sahne","amount":200,"unit":"ml"},{"name":"Käse","amount":100,"unit":"g","note":"gerieben"},{"name":"Knoblauch","amount":1,"unit":"Zehe"},{"name":"Muskatnuss","amount":1,"unit":"Prise"},{"name":"Butter","amount":1,"unit":"TL"},{"name":"Salz und Pfeffer","amount":null,"unit":"","note":"nach Geschmack"}],"steps":["Backofen auf 190 °C Ober-/Unterhitze vorheizen. Auflaufform mit Butter ausstreichen. Kartoffeln schälen und in dünne Scheiben schneiden.","Sahne mit fein geriebenem Knoblauch, Muskat, Salz und Pfeffer verrühren. Kartoffeln dachziegelartig in die Form schichten und Sahne darübergeben.","Mit Käse bestreuen und 45–55 Minuten backen, bis die Kartoffeln weich und die Oberfläche goldbraun ist. Vor dem Servieren 5 Minuten ruhen lassen."]}];

 function open(id){
   root.querySelectorAll('[role=tabpanel]').forEach(panel=>panel.hidden=panel.id!=='ws-'+id);

 });
 if(globalThis.Tweak){const state={radius:18};const tweak=new Tweak({container:root,onChange:()=>root.querySelectorAll('.ws-phone').forEach(p=>p.style.setProperty('--ws-radius',state.radius+'px'))});tweak.addSlider(state,'radius',{label:'Kartenrundung',min:10,max:24,unit:'px',reference:'--ws-radius'})}
